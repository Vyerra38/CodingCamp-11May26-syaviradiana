<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Chart.js 4.x from CDN -->
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"
      defer
    ></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <div class="header-actions">
        <!-- Currency toggle -->
        <button id="currency-toggle" type="button" aria-label="Toggle currency between USD and IDR">
        Switch to IDR
        </button>
        <!-- Dark/light mode toggle -->
        <button id="theme-toggle" class="theme-btn">
          <span id="sun-icon" class="icon-hidden">☀️</span>
          <span id="moon-icon">🌙</span>
        </button>
      </div>
    </header>

    <main>
      <!-- Balance Card -->
      <section id="balance-card" aria-label="Total balance">
        <h2><b>Total Balance</b></h2>
        <p id="balance-amount">$0.00</p>
      </section>

      <!-- Expense Form -->
      <section id="expense-form-section" aria-label="Add expense">
        <h2>Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="itemName"
              maxlength="100"
              placeholder="Input Name Item"
              aria-describedby="item-name-error"
            />
            <span class="error-msg" id="item-name-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount (USD)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              step="0.01"
              placeholder="Input Dollar Currency example $5.50"
              aria-describedby="amount-error"
            />
            <span class="error-msg" id="amount-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" aria-describedby="category-error">
              <option value="" disabled selected>Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error-msg" id="category-error" role="alert"></span>
          </div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- Transaction List -->
      <section id="transaction-list" aria-label="Transaction list">
        <h2>Transactions</h2>
        <div id="transaction-list-container">
          <p class="empty-msg">No transactions recorded yet.</p>
        </div>
      </section>

      <!-- Spending Chart -->
      <section id="spending-chart" aria-label="Spending by category">
        <h2>Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart-canvas" aria-label="Pie chart of spending by category" role="img"></canvas>
          <p id="chart-placeholder" class="placeholder-msg">No spending data available.</p>
        </div>
      </section>

      <!-- Monthly Summary -->
      <section id="monthly-summary" aria-label="Monthly summary">
        <h2>Monthly Summary</h2>
        <div class="summary-controls">
          <label for="month-selector">Select Month</label>
          <select id="month-selector"></select>
        </div>
        <div id="summary-stats">
          <div class="stat-card">
            <span class="stat-label">Total Expenses</span>
            <span id="summary-total" class="stat-value">$0.00</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Transactions</span>
            <span id="summary-count" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Top Category</span>
            <span id="summary-top-category" class="stat-value">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Average Amount</span>
            <span id="summary-average" class="stat-value">$0.00</span>
          </div>
        </div>
        <p id="summary-no-data" class="placeholder-msg">No data available for this month.</p>
      </section>
    </main>

    <!-- Toast notification area -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
